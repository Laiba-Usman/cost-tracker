services:
  - type: web
    name: cost-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the rate limiter keeps its counters in memory and SQLite allows one writer.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: MPLCONFIGDIR
        value: /tmp/mpl
